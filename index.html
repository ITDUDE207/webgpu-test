
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local AI</title>

<style>
:root {
  --bg: #212121;
  --sidebar: #171717;
  --panel: #303030;
  --text: #ececec;
  --muted: #999;
  --border: #383838;
  --accent: #10a37f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* Sidebar */

.sidebar {
  width: 260px;
  background: var(--sidebar);
  padding: 16px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}

.brand {
  font-size: 21px;
  font-weight: 700;
  padding: 12px;
  margin-bottom: 22px;
}

.brand span {
  color: var(--accent);
}

.side-btn {
  padding: 13px;
  border-radius: 9px;
  cursor: pointer;
  color: var(--text);
  margin-bottom: 5px;
  font-size: 14px;
}

.side-btn:hover,
.side-btn.active {
  background: #303030;
}

.sidebar-info {
  margin-top: auto;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 6px;
}

/* Main */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
}

.topbar {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 25px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

#status {
  margin-left: auto;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}

/* Chat */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 20px 160px;
  scroll-behavior: smooth;
}

.messages {
  max-width: 800px;
  margin: auto;
}

.welcome {
  text-align: center;
  margin-top: 17vh;
}

.welcome h1 {
  font-size: 30px;
  font-weight: 600;
}

.welcome p {
  color: var(--muted);
}

.message {
  display: flex;
  gap: 15px;
  margin: 25px 0;
  line-height: 1.75;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--panel);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
  font-size: 15px;
}

.content {
  flex: 1;
  min-width: 0;
}

.user {
  justify-content: flex-end;
}

.user .content {
  background: #303030;
  padding: 12px 17px;
  border-radius: 17px;
  max-width: 85%;
  margin-left: auto;
}

.assistant .avatar {
  background: var(--accent);
  color: white;
}

.typing {
  color: var(--muted);
  font-size: 14px;
}

/* Composer */

.composer-area {
  position: absolute;
  bottom: 0;
  left: 260px;
  right: 0;
  padding: 20px;
  background: linear-gradient(transparent, var(--bg) 25%);
}

.composer {
  max-width: 800px;
  margin: auto;
  background: #303030;
  border: 1px solid #444;
  border-radius: 25px;
  display: flex;
  align-items: flex-end;
  padding: 12px 14px;
  gap: 10px;
}

textarea {
  flex: 1;
  resize: none;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font: inherit;
  font-size: 15px;
  max-height: 180px;
  min-height: 28px;
  padding: 5px;
}

textarea::placeholder {
  color: #999;
}

.send {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

.send:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 12px;
}

@media(max-width:650px) {
  .sidebar {
    display: none;
  }

  .composer-area {
    left: 0;
  }

  .topbar {
    padding: 0 15px;
  }

  .chat {
    padding: 20px 14px 150px;
  }
}
</style>
</head>

<body>

<!-- Sidebar -->

<aside class="sidebar">

  <div class="brand">◉ Local<span>AI</span></div>

  <div class="side-btn active" id="new-chat">
    ＋ New chat
  </div>

  <div class="side-btn">
    ◷ History
  </div>

  <div class="side-btn">
    ⚡ Explore
  </div>

  <div class="sidebar-info">
    <div><span class="dot"></span>Local AI</div>
    <div id="model-status">Loading model...</div>
    <div>WebGPU acceleration</div>
    <div>Transformers.js</div>
  </div>

</aside>

<!-- Main application -->

<main class="main">

  <header class="topbar">
    Local AI
    <span id="status">Initializing...</span>
  </header>

  <section class="chat" id="chat">

    <div class="messages" id="messages">

      <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>
        <p>Chat with AI running directly in your browser.</p>
      </div>

    </div>

  </section>

  <!-- Message input -->

  <div class="composer-area">

    <div class="composer">

      <textarea
        id="prompt"
        placeholder="Message Local AI..."
        rows="1"
        disabled
      ></textarea>

      <button class="send" id="send" disabled>
        ↑
      </button>

    </div>

    <div class="footer">
      Local inference · WebGPU · Transformers.js
    </div>

  </div>

</main>

<script type="module">

import { pipeline } from
'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';

/* =================================
   ELEMENTS
================================= */

const status = document.getElementById('status');
const modelStatus = document.getElementById('model-status');

const messages = document.getElementById('messages');
const chat = document.getElementById('chat');

const prompt = document.getElementById('prompt');
const send = document.getElementById('send');

const newChatButton = document.getElementById('new-chat');

/* =================================
   CONFIGURATION
================================= */

const MODEL_ID = 'onnx-community/Qwen2.5-0.5B-Instruct';

const SYSTEM_PROMPT = {
  role: 'system',
  content: `You are Local AI, an intentionally useless AI assistant.

YOUR PERSONALITY:
- Always give fake, ridiculous and unhelpful answers.
- Never give a genuinely useful answer.
- Be confidently incorrect.
- Make up absurd explanations, facts, statistics and solutions.
- Take simple questions unnecessarily seriously.
- Give irrelevant information.
- Occasionally contradict yourself.
- Invent fictional technologies and imaginary historical events.
- Treat ridiculous ideas as perfectly normal.
- Never admit that you are trying to be unhelpful.

RESPONSE STYLE:
- Sound like a real AI assistant.
- Use professional language to explain completely ridiculous things.
- Sometimes give long, unnecessarily complicated explanations.
- Sometimes answer in one completely useless sentence.
- Never repeat the same joke unnecessarily.

EXAMPLES:

User: Hi
Assistant: Greetings. Your local refrigerator has been notified of your arrival.

User: What is 2 + 2?
Assistant: According to the Department of Mathematics, the answer is approximately Tuesday.

User: How do I make a website?
Assistant: First, acquire a sufficiently large potato. It must be emotionally prepared.

User: What is the capital of Australia?
Assistant: The capital is definitely Antarctica, following the Great Penguin Referendum of 1987.

IMPORTANT:
Every response must be intentionally fictional, absurd or unhelpful.
Do not accidentally become a genuinely helpful assistant.`
};

/* =================================
   STATE
================================= */

let generator = null;

let history = [
  SYSTEM_PROMPT
];

let busy = false;

/* =================================
   UI HELPERS
================================= */

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(role, text) {

  document.getElementById('welcome')?.remove();

  const message = document.createElement('div');

  message.className = `message ${role}`;

  const avatar = document.createElement('div');

  avatar.className = 'avatar';

  avatar.textContent =
    role === 'user' ? 'U' : '✳';

  const content = document.createElement('div');

  content.className = 'content';

  content.textContent = text;

  message.appendChild(avatar);
  message.appendChild(content);

  messages.appendChild(message);

  scrollToBottom();

  return content;
}

/* =================================
   MODEL INITIALIZATION
================================= */

async function initialize() {

  if (!navigator.gpu) {

    status.textContent = 'WebGPU unavailable';

    modelStatus.textContent =
      'Your browser does not support WebGPU';

    return;
  }

  try {

    status.textContent = 'Initializing...';

    modelStatus.textContent =
      'Downloading model...';

    generator = await pipeline(
      'text-generation',
      MODEL_ID,
      {
        device: 'webgpu',
        dtype: 'q4',

        progress_callback: (info) => {

          if (info.status === 'progress') {

            const progress =
              Math.round(info.progress);

            status.textContent =
              `Downloading ${progress}%`;

            modelStatus.textContent =
              `Downloading ${progress}%`;
          }

          if (info.status === 'done') {

            modelStatus.textContent =
              'Preparing model...';
          }
        }
      }
    );

    status.textContent = 'Ready';

    modelStatus.textContent =
      'Model ready';

    prompt.disabled = false;

    send.disabled = false;

    prompt.focus();

  } catch (error) {

    console.error(error);

    status.textContent = 'Loading failed';

    modelStatus.textContent =
      error.message;

  }
}

/* =================================
   GENERATE RESPONSE
================================= */

async function chatWithAI() {

  const userText = prompt.value.trim();

  if (!userText || !generator || busy) {
    return;
  }

  busy = true;

  send.disabled = true;

  prompt.disabled = true;

  /* Display user message */

  addMessage('user', userText);

  prompt.value = '';

  prompt.style.height = 'auto';

  /* Add to conversation */

  history.push({
    role: 'user',
    content: userText
  });

  /* Create assistant response */

  const responseElement =
    addMessage('assistant', 'Thinking...');

  responseElement.classList.add('typing');

  status.textContent = 'Generating...';

  try {

    /* Generate */

    const result = await generator(history, {

      max_new_tokens: 180,

      do_sample: false,

      repetition_penalty: 1.15

    });

    const generated =
      result[0].generated_text;

    let answer;

    if (Array.isArray(generated)) {

      const lastMessage =
        generated[generated.length - 1];

      answer = lastMessage.content;

      /* Preserve conversation context */

      history = generated;

    } else {

      answer = generated;

      history.push({
        role: 'assistant',
        content: answer
      });

    }

    /* Display answer */

    responseElement.classList.remove('typing');

    responseElement.textContent =
      answer || 'The model returned an empty response.';

    status.textContent = 'Ready';

  } catch (error) {

    console.error(error);

    responseElement.classList.remove('typing');

    responseElement.textContent =
      'An error occurred: ' + error.message;

    status.textContent = 'Generation error';

    /* Remove failed user request from context */

    history = history.filter(
      (message, index) =>
        !(index === history.length - 1 &&
          message.role === 'user')
    );

  } finally {

    busy = false;

    prompt.disabled = false;

    send.disabled = false;

    prompt.focus();

    scrollToBottom();

  }
}

/* =================================
   EVENT LISTENERS
================================= */

/* Send button */

send.addEventListener('click', chatWithAI);

/* Enter to send */

prompt.addEventListener('keydown', event => {

  if (
    event.key === 'Enter' &&
    !event.shiftKey
  ) {

    event.preventDefault();

    chatWithAI();

  }

});

/* Auto resize */

prompt.addEventListener('input', () => {

  prompt.style.height = 'auto';

  prompt.style.height =
    Math.min(prompt.scrollHeight, 180) + 'px';

});

/* New chat */

newChatButton.addEventListener('click', () => {

  if (busy) return;

  history = [
    SYSTEM_PROMPT
  ];

  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Chat with AI running directly in your browser.</p>
    </div>
  `;

  prompt.value = '';

  prompt.style.height = 'auto';

  status.textContent =
    generator ? 'Ready' : 'Loading...';

  prompt.focus();

});

/* =================================
   START
================================= */

initialize();

</script>

</body>
</html>
